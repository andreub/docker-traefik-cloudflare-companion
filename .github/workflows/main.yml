name: build_image

on:
  push:
    branches: [main]
    tags: ["*-andreub.*"]
    paths-ignore: ["README.md", "CHANGELOG.md"]
  schedule:
    # Weekly rebuild to pick up Alpine security updates (Watchtower pulls :latest)
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/docker-traefik-cloudflare-companion

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build (amd64) for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tcc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security checks (brotli, root CAs, certifi)
        run: .github/scripts/security-check.sh image tcc:ci

      - name: Smoke test
        run: |
          docker run --rm tcc:ci python3 -c 'import docker, requests, cloudflare, get_docker_secret, certifi; print("imports ok, certifi:", certifi.where())'
          docker run --rm -e DRY_RUN=true -e CF_TOKEN=dummy -e TARGET_DOMAIN=example.com \
            -e DOMAIN1=example.com -e DOMAIN1_ZONE_ID=dummy -e ENABLE_DOCKER_POLL=false tcc:ci

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
